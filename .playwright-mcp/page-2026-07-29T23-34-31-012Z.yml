                  - 'heading "1. The Critique: What they get right and wrong" [level=3] [ref=f1e1396]'
                  - list [ref=f1e1397]:
                    - listitem [ref=f1e1398]:
                      - paragraph [ref=f1e1399]: "Qwen (CDP Network + DOM):"
                      - list [ref=f1e1400]:
                        - listitem [ref=f1e1401]:
                          - paragraph [ref=f1e1402]: "Right: Network events (SSE) are the ultimate source of truth."
                        - listitem [ref=f1e1403]:
                          - paragraph [ref=f1e1404]: "Wrong: Building a universal network parser is a nightmare. Every site uses different endpoints, protocols (WebSockets, SSE, custom chunked fetch), and JSON schemas. You'd be updating this weekly. Discard Layer 1."
                    - listitem [ref=f1e1405]:
                      - paragraph [ref=f1e1406]: "GLM-5.2 (Text Stability & Delta Diffing):"
                      - list [ref=f1e1407]:
                        - listitem [ref=f1e1408]:
                          - paragraph [ref=f1e1409]: "Right: Looking for the disappearance of a \"Stop Generating\" button is a powerful heuristic."
                        - listitem [ref=f1e1410]:
                          - paragraph [ref=f1e1411]:
                            - text: "Wrong: Polling"
                            - code [ref=f1e1412]: body.innerText
                            - text: is incredibly inefficient and will break if sites use virtualized lists (hiding old messages). Delta diffing via
                            - code [ref=f1e1413]: lastIndexOf(promptText)
                            - text: is dangerous if the AI decides to quote your prompt earlier in its response.
                    - listitem [ref=f1e1414]:
                      - paragraph [ref=f1e1415]: "Kimi (Archaeology Engine):"
                      - list [ref=f1e1416]:
                        - listitem [ref=f1e1417]:
                          - paragraph [ref=f1e1418]: "Right: The Scoring System is genius. Formalizing \"what does an AI response look like?\" (growth rate, bottom 70% of screen, block size) is the most robust way to find the answer without relying on specific CSS classes. A 90-second timeout is also a necessary safety net."
                        - listitem [ref=f1e1419]:
                          - paragraph [ref=f1e1420]:
                            - text: "Wrong: Pre-injecting can miss dynamically loaded iframes. Relying on network idle ("
                            - code [ref=f1e1421]: networkIdle2
                            - text: ) is unreliable because of background telemetry/analytics pings.
                    - listitem [ref=f1e1422]:
                      - paragraph [ref=f1e1423]: "DeepSeek (CDP-Injected Watcher):"
                      - list [ref=f1e1424]:
                        - listitem [ref=f1e1425]:
                          - paragraph [ref=f1e1426]:
                            - text: "Right: Using"
                            - code [ref=f1e1427]: Runtime.evaluate
                            - text: with
                            - code [ref=f1e1428]: "awaitPromise: true"
                            - text: is the absolute best MV3 pattern. It keeps your background worker clean and eliminates the need for messy message-passing.
                        - listitem [ref=f1e1429]:
                          - paragraph [ref=f1e1430]: "Wrong: \"Sibling traversal\" (finding the user prompt and traversing to the next sibling) assumes a flat, predictable DOM tree. React/Next.js apps often nest elements deeply, making naive sibling traversal break instantly."
                  - 'heading "2. The Decision: The \"Anchor-Score-Settle\" Protocol" [level=3] [ref=f1e1431]'
                  - paragraph [ref=f1e1432]:
                    - text: We are taking DeepSeek's execution model (
