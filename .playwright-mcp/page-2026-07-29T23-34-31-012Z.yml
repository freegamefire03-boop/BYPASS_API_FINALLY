                      - generic [ref=f1e1468]: function watchForAnswer(tabId, promptText)
                      - text: "{ // We stringify the function so it can be sent via CDP to the page context. const pageScript = ` (async function() { return new Promise((resolve, reject) => { const TIMEOUT_MS = 90000; // Kimi's 90s safety net const SETTLE_DELAY_MS = 2500; // 2.5s debounce let candidates = new Map(); let activeNode = null; let settleTimer = null; let timeoutTimer = null; // 1. Kimi's Scoring Algorithm function scoreNode(node) { if (!node || node.nodeType !== Node.ELEMENT_NODE) return 0; let score = 0; const rect = node.getBoundingClientRect(); const textLength = node.textContent.trim().length; // Must have substance if (textLength < 10) return -100; // Bottom 70% of viewport gets high points if (rect.top > (window.innerHeight * 0.3)) score += 500; // Block level elements preferred const style = window.getComputedStyle(node); if (['block', 'flex', 'grid'].includes(style.display)) score += 300; // Size matters if (rect.width > 200 && rect.height > 50) score += 200; return score + textLength; } // 2. Final Extraction (Traverse up to get clean block) function extractFinalText(node) { // Walk up to find the main container to capture markdown formatting let container = node; while (container.parentElement && ['P', 'SPAN', 'CODE', 'PRE'].includes(container.tagName)) { container = container.parentElement; } // Return HTML so you can parse it to Markdown in the background script return { text: container.innerText, html: container.innerHTML }; } // 3. Completion Check (My Settle Timer + GLM heuristics) function triggerCompletion() { cleanup(); // Check for GLM's \"Stop\" heuristic const stopButtons = Array.from(document.querySelectorAll('button')).filter(b => /stop|halt|cancel/i.test(b.innerText || b.getAttribute('aria-label') || '') ); // If a stop button is still visible, wait and retry if (stopButtons.some(b => b.offsetParent !== null)) { settleTimer = setTimeout(triggerCompletion, SETTLE_DELAY_MS); return; } resolve(extractFinalText(activeNode)); } // 4. The Observer (Kimi + DeepSeek hybrid) const observer = new MutationObserver((mutations) => { let needsEvaluation = false; mutations.forEach(mut => { if (mut.type === 'childList' && mut.addedNodes.length > 0) { needsEvaluation = true; } else if (mut.type === 'characterData') { needsEvaluation = true; } }); if (!needsEvaluation) return; // Find the best growing node const textNodes = Array.from(document.querySelectorAll('div, p, article, main')) .filter(el => el.textContent.length > 20); let bestNode = null; let highestScore = 0; textNodes.forEach(node => { const score = scoreNode(node); if (score > highestScore) { highestScore = score; bestNode = node; } }); if (bestNode && highestScore > 500) { activeNode = bestNode; // Debounce the settle timer clearTimeout(settleTimer); settleTimer = setTimeout(triggerCompletion, SETTLE_DELAY_MS); } }); // Start observing the whole body for Kimi's Archaeology observer.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: false }); function cleanup() { observer.disconnect(); clearTimeout(settleTimer); clearTimeout(timeoutTimer); } // Failsafe timeout timeoutTimer = setTimeout(() => { cleanup(); if (activeNode) { resolve(extractFinalText(activeNode)); // Return what we have so far } else { reject(new Error('AI generation timeout: No active node found')); } }, TIMEOUT_MS); }); })(); `; try { const response = await chrome.debugger.sendCommand({ tabId }, 'Runtime.evaluate', { expression: pageScript, awaitPromise: true, // DeepSeek's MV3 magic: waits for the promise to resolve! returnByValue: true // Ensures we get the actual JS object back, not a remote object ID }); if (response.exceptionDetails) { throw new Error('Injected script failed: ' + response.exceptionDetails.text); } return response.result.value; // Returns { text: \"...\", html: \"...\" } } catch (err) { console.error("
                      - generic [ref=f1e1469]: "`[AI Chat Auto-Prompt] Watcher failed on tab ${tabId}:`"
                      - text: ", err); throw err; } }"
