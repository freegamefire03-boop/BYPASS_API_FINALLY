rentElement); if (el && !candidates.has(el)) { candidates.set(el, { el, textLen: 0, growthRate: 0 }); } if (el) { const entry = candidates.get(el); const newLen = el.innerText.length; entry.growthRate = newLen - entry.textLen; entry.textLen = newLen; entry.lastUpdated = Date.now(); candidates.set(el, entry); } } else if (mut.type === 'childList') { for (const added of mut.addedNodes) { if (added.nodeType === Node.ELEMENT_NODE) { const el = getCandidate(added); if (el && !candidates.has(el)) { candidates.set(el, { el, textLen: 0, growthRate: 0 }); } // Also check text nodes inside added fragments const walk = document.createTreeWalker(added, NodeFilter.SHOW_TEXT); while (walk.nextNode()) { const el = getCandidate(walk.currentNode.parentElement); if (el) { // same as above const entry = candidates.get(el) || { el, textLen: 0, growthRate: 0 }; const newLen = el.innerText.length; entry.growthRate = newLen - entry.textLen; entry.textLen = newLen; entry.lastUpdated = Date.now(); candidates.set(el, entry); } } } } } } lastMutationTime = Date.now(); updateBestCandidate(); } // ---- Detection of \"stop\" button and input re‑enable ---- function detectStopButtonDisappearance() { // We assume the stop button is a <button> with text like \"Stop\", \"Cancel\", or an aria-label. const stopButtons = Array.from(document.querySelectorAll('button, [role=\"button\"]')).filter(b => /stop|cancel|interrupt/i.test(b.textContent || b.getAttribute('aria-label') || '') ); return stopButtons.length === 0; // true when no stop button exists } async function waitForInputReenable(originalInputElement) { // If we know which input was used (we'll pass its selector), poll until it's not disabled. // For generality, we'll watch for any input/textarea that was disabled and becomes enabled. // We'll implement a fallback: just wait until document.activeElement is not disabled. // Better: we can grab the element that has attribute 'data-autoprompt-input' from your earlier code. // I'll use that. const c