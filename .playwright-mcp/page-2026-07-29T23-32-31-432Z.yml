this isn't a bug, it's how Chrome's input pipeline works, confirmed both // by Chromium's own issue tracker and by real testing. So there is no way // to deliver a genuinely trusted Ctrl+V/Enter to a tab that isn't the // frontmost tab at that exact moment. // // THE FIX (default behavior): open every URL in parallel first — this part // really is simultaneous, since loading a background tab is NOT blocked, // only INPUT delivery is. Then, once every tab has had its chance to load, // the extension itself rapidly cycles which tab is \"active\" — the exact // same thing you were doing by hand with Ctrl+1/2/3 — briefly bringing each // tab to the front just long enough to paste and send, then moving to the // next one. No manual navigation needed; it's automated and near-instant // per tab (a few hundred ms). // // INPUT DETECTION (auto-cycle): Primary method polls document.activeElement // for up to 8s. If the site doesn't auto-focus its input, a fallback kicks // in: the extension simulates Tab keypresses (via debugger, trusted events, // page-only — the omnibox is never reached) to walk through all focusable // elements, collects text-input candidates, scores them (textarea > // contenteditable > input, large > small, bottom-of-page > top-of-page), // and focuses the best match. If both methods fail, the tab is aborted with // a clear error (no blind firing). // // TEXT INSERTION: The prompt is injected directly into each tab's focused // input via CDP's Input.insertText — no system clipboard is involved. // This means the user can freely copy/paste on their PC while the // extension runs without corrupting the prompt being sent. // // VERIFICATION: Two-stage post-send check. Stage 1 polls the tab URL for // 1.5s — if it changes, the prompt was delivered. If Stage 1 fails, Stage 2 // polls the exact input element we wrote into (found via a temporary // data-autoprompt-input attribute) for 1.5s — if its content is cleared, // the site consumed the prompt. If both st