most universal binary signal. - Signal 3 — Stop Button Gone (MEDIUM): No visible button matching /stop|halt|generate/i. Z.ai contribution. - Signal 4 — Hard Timeout (LOW): 90s absolute max. Return whatever we have. - Circuit logic: Signal 1 AND (Signal 2 OR Signal 3) = COMPLETE. If Signal 1 alone for 8s, also COMPLETE with partial warning. ### Extraction Strategy - Primary: Best candidate innerText with cleanup (strip buttons, SVGs, nav elements via cloneNode). - Fallback 1 (low candidate score): Delta diff — body.innerText before/after, lastIndexOf(prompt) as anchor. - Fallback 2 (prompt found in DOM): TreeWalker to prompt text node → parent container → subsequent sibling (DeepSeek approach). - Output: { text, html, wordCount, confidence: high|medium|low } ### MV3 Considerations - Debugger attachment keeps worker alive. - onDetach listener to abort watcher gracefully. - observer.disconnect() and cleanup on resolve. - Tab crash → promise rejects → caught → cleanup → status = error. ### Shadow DOM - Initial: IGNORE shadow roots (95% coverage). - Future: Recursive shadowRoot walker. - Targeting light DOM only. ### CDP Network Layer - EXCLUDED from base plan. Too fragile per-site SSE/WebSocket schema knowledge required. - Reserved as optional accelerator for known domains. == YOUR TASK == 1. CRITIQUE: What is STILL wrong or missing? Identify contradictions, race conditions, blind spots. 2. REFINE: For EACH section above, tell me exactly what to change and why. 3. FINAL CODE: Write complete injectResponseWatcher.js — the string for Runtime.evaluate. Include: MutationObserver, scoring, completion detection with all signals, extraction with fallbacks, cleanup. 4. TRADE-OFF ACKNOWLEDGMENT: For every compromise, state what edge case it misses. Be blunt. Tear the plan apart."