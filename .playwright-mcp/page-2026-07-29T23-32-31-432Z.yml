ical; min-height: 90px; } input:focus, textarea:focus { outline: none; border-color: #4f7cff; } button { width: 100%; margin-top: 14px; padding: 10px; border: none; border-radius: 6px; background: #4f7cff; color: white; font-size: 14px; font-weight: 600; cursor: pointer; } button:disabled { background: #555; cursor: default; } #status { margin-top: 8px; font-size: 12px; color: #9ad; min-height: 14px; white-space: pre-line; } #results-section { margin-top: 14px; border-top: 1px solid #333; padding-top: 10px; display: none; } #results-section h4 { margin: 0 0 6px 0; font-size: 12px; color: #aaa; font-weight: 600; } .result-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; font-size: 11px; line-height: 1.4; } .result-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; } .result-dot.success { background: #4caf50; } .result-dot.uncertain { background: #ff9800; } .result-dot.error { background: #f44336; } .result-url { color: #ccc; word-break: break-all; } .result-reason { color: #777; font-size: 10px; margin-top: 1px; } .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 8px; } .toggle-row .toggle-label { font-size: 12px; color: #ccc; line-height: 1.3; } .toggle-row .toggle-hint { font-size: 10px; color: #777; } .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; } .switch input { opacity: 0; width: 0; height: 0; } .slider { position: absolute; cursor: pointer; inset: 0; background-color: #444; transition: .15s; border-radius: 20px; } .slider:before { position: absolute; content: \"\"; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .15s; border-radius: 50%; } input:checked + .slider { background-color: #4f7cff; } input:checked + .slider:before { transform: translateX(16px); } </style> </head> <body> <h3>AI Chat Auto-Prompt</h3> <div class=\"sub\">Opens tabs in parallel, pastes, and hits Enter automatically.</div> <label for=\"urls\">AI chat URLs (one per line)</label> <textarea id=\"urls\" placeholder=\"https://gemini.google.com/app&#10;https://claude.ai/new&#10;https://chat.deepseek.com\" style=\"min-height:70px;\"></textarea> <label for=\"prompt\">Prompt</label> <textarea id=\"prompt\" placeholder=\"Type the prompt to send...\"></textarea> <div class=\"toggle-row\"> <div> <div class=\"toggle-label\">Skip waiting for full page load</div> <div class=\"toggle-hint\">Starts checking for the input box ~1s after opening instead of waiting for \"loaded\"</div> </div> <label class=\"switch\"> <input type=\"checkbox\" id=\"skipWait\"> <span class=\"slider\"></span> </label> </div> <div class=\"toggle-row\"> <div> <div class=\"toggle-label\">Stealth mode (background)</div> <div class=\"toggle-hint\">All tabs run in parallel. Works while Chrome is minimized. No focus stealing.</div> </div> <label class=\"switch\"> <input type=\"checkbox\" id=\"experimentalBackground\"> <span class=\"slider\"></span> </label> </div> <button id=\"submit\">Open &amp; Send</button> <div id=\"status\"></div> <div id=\"results-section\"> <h4>Run Results</h4> <div id=\"results-list\"></div> </div> <script src=\"popup.js\"></script> </body> </html> ``` ## `popup.js` ```js const urlsInput = document.getElementById('urls'); const promptInput = document.getElementById('prompt'); const skipWaitInput = document.getElementById('skipWait'); const experimentalBgInput = document.getElementById('experimentalBackground'); const submitBtn = document.getElementById('submit'); const statusEl = document.getElementById('status'); const resultsSection = document.getElementById('results-section'); const resultsList = document.getElementById('results-list'); chrome.storage.local.get(['lastUrls', 'skipWait', 'experimentalBackground', 'lastRunResults'], (res) => { if (res.lastUrls) urlsInput.value = res.lastUrls; if (res.skipWait) skipWaitInput.checked = true; if (res.experimentalBackground) experimentalBgInput.checked = true; if (res.lastRunResults && res.lastRunResults.length > 0) { displayResults(res.lastRunResults); } }); skipWaitInput.addEventListener('change', () => { chrome.storage.local.set({ skipWait: skipWaitInput.checked }); }); experimentalBgInput.addEventListener('change', () => { chrome.storage.local.set({ experimentalBackground: experimentalBgInput.checked }); }); function parseUrls(raw) { return raw .split(/[\\n,]+/) .map((s) => s.trim()) .filter(Boolean) .map((u) => (/^https?:\\/\\//i.test(u) ? u : 'https://' + u)) .filter((u, i, arr) => arr.indexOf(u) === i); } function displayResults(results) { resultsList.innerHTML = ''; for (const r of results) { const item = document.createElement('div'); item.className = 'result-item'; const dot = document.createElement('div'); dot.className = 'result-dot ' + r.status; item.appendChild(dot); const textWrap = document.createElement('div'); const urlEl = document.createElement('div'); urlEl.className = 'result-url'; try { urlEl.textContent = new URL(r.url).hostname; } catch (_e) { urlEl.textContent = r.url; } textWrap.appendChild(urlEl); const reasonEl = document.createElement('div'); reasonEl.className = 'result-reason'; reasonEl.textContent = r.status === 'success' ? r.reason : 'FAILED: ' + r.reason; textWrap.appendChild(reasonEl); item.appendChild(textWrap); resultsList.appendChild(item); } resultsSection.style.display = 'block'; } submitBtn.addEventListener('click', async () => { const urls = parseUrls(urlsInput.value); const prompt = promptInput.value; const skipWait = skipWaitInput.checked; if (urls.length === 0) { statusEl.textContent = 'Enter at least one URL first.'; return; } if (!prompt) { statusEl.textContent = 'Enter a prompt first.'; return; } resultsSection.style.display = 'none'; resultsList.innerHTML = ''; await chrome.storage.local.remove('lastRunResults'); chrome.storage.local.set({ lastUrls: urlsInput.value, skipWait, experimentalBackground: experimentalBgInput.checked }); submitBtn.disabled = true; statusEl.textContent = 'Working... opening ' + urls.length + ' tab' + (urls.length > 1 ? 's' : '') + ' in parallel.'; try { await chrome.runtime.sendMessage({ type: 'RUN_AUTOMATION', urls, prompt, skipWait, experimentalBackground: experimentalBgInput.checked }); statusEl.textContent = 'Tabs opened. Sending prompt, then verifying...'; } catch (e) { statusEl.textContent = 'Error: ' + (e && e.message ? e.message : e); submitBtn.disabled = false; return; } pollForResults(); }); function pollForResults() { var maxWait = 180000; var interval = 1000; var elapsed = 0; function check() { chrome.storage.local.get(['lastRunResults', 'lastRunFinishedAt'], (res) => { if (res.lastRunFinishedAt && res.lastRunResults) { displayResults(res.lastRunResults); var successCount = res.lastRunResults.filter(function (r) { return r.status === 'success'; }).length; var totalCount = res.lastRunResults.length; statusEl.textContent = 'Done: ' + successCount + '/' + totalCount + ' succeeded.'; submitBtn.disabled = false; return; } elapsed += interval; if (elapsed >= maxWait) { statusEl.textContent = 'Timed out waiting for results. Check service worker console.'; submitBtn.disabled = false; return; } setTimeout(check, interval); }); } check(); } ```"
