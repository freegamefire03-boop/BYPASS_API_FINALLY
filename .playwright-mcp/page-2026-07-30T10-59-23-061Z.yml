                        - code [ref=e1702]: "const injectResponseWatcher = ` (async function() { return new Promise((resolve, reject) => { const TIMEOUT_MS = 90000; const SETTLE_DELAY_MS = 2500; const FORCE_COMPLETE_DELAY_MS = 5000; let candidates = new Map(); let activeNode = null; let lastTextLength = 0; let settleTimer = null; let forceTimer = null; let timeoutTimer = null; // --- 1. Scoring Engine --- function scoreNode(node) { if (!node || node.nodeType !== Node.ELEMENT_NODE) return 0; // IGNORE user inputs entirely to prevent self-capturing the prompt if (node.closest('input, textarea, [contenteditable=\"true\"], [data-autoprompt-input]')) return -1000; const text = node.textContent.trim(); if (text.length < 15) return 0; let score = text.length; // Base score is text length const rect = node.getBoundingClientRect(); const style = window.getComputedStyle(node); // Position heuristics if (rect.top > (window.innerHeight * 0.3)) score += 500; if (rect.top < 100) score -= 200; // Penalize headers/nav // Structural heuristics if (['block', 'flex', 'grid'].includes(style.display)) score += 300; if (rect.width > 300 && rect.height > 50) score += 200; return score; } // --- 2. Extraction & Cleanup --- function extractCleanData(node) { // Traverse up to find the closest semantic container let container = node; while (container.parentElement && ['P', 'SPAN', 'CODE', 'PRE'].includes(container.tagName)) { container = container.parentElement; } // Clone to avoid breaking the actual UI const clone = container.cloneNode(true); // Strip garbage UI elements (copy buttons, SVGs, tooltips) const garbage = clone.querySelectorAll('button, svg, nav, [role=\"tooltip\"], .copy-btn'); garbage.forEach(g => g.remove()); return { text: clone.innerText.trim(), html: clone.innerHTML.trim(), confidence: 'high' }; } // --- 3. The Multi-Signal Circuit --- function checkCompletionSignals() { if (!activeNode) return false; // Signal 2: Input Re-enabled OR Re-mounted let inputUnlocked = false; const markedInput = document.querySelector('[data-autoprompt-input]'); if (markedInput) { inputUnlocked = !markedInput.disabled && !markedInput.readOnly; } else { // React destroyed it. Look for a new one. const freshInput = document.querySelector('textarea, [contenteditable=\"true\"]'); if (freshInput) inputUnlocked = !freshInput.disabled && freshInput.getAttribute('contenteditable') !== 'false'; } // Signal 3: Stop Button Gone const stopBtnVisible = Array.from(document.querySelectorAll('button')).some(b => { const t = (b.innerText || b.getAttribute('aria-label') || '').toLowerCase(); return (t.includes('stop') || t.includes('halt')) && b.offsetParent !== null; }); // The Circuit return inputUnlocked || !stopBtnVisible; } function triggerCompletion(reason) { cleanup(); if (activeNode) { const data = extractCleanData(activeNode); data.reason = reason; resolve(data); } else { reject(new Error('Watcher completed but no candidate node was ever found.')); } } // --- 4. The Observer --- const observer = new MutationObserver((mutations) => { // Only react to text or child list changes, ignore attribute spins const hasRelevantMutation = mutations.some(m => m.type === 'characterData' || m.type === 'childList'); if (!hasRelevantMutation) return; // Re-evaluate candidates const textNodes = Array.from(document.querySelectorAll('div, p, article, main, section')) .filter(el => el.textContent.length > 20); let bestNode = null; let highestScore = 0; textNodes.forEach(node => { const score = scoreNode(node); if (score > highestScore) { highestScore = score; bestNode = node; } }); if (bestNode && highestScore > 500) { activeNode = bestNode; const currentLength = activeNode.textContent.length; // If text is actually growing, reset timers if (currentLength > lastTextLength) { lastTextLength = currentLength; clearTimeout(settleTimer); clearTimeout(forceTimer); // Signal 1 (Settle) + Signals 2/3 check settleTimer = setTimeout(() => { if (checkCompletionSignals()) { triggerCompletion('circuit_met'); } }, SETTLE_DELAY_MS); // 5-Second Bypass Fallback forceTimer = setTimeout(() => { triggerCompletion('force_timeout'); }, FORCE_COMPLETE_DELAY_MS); } } }); // Start watching observer.observe(document.body, { childList: true, subtree: true, characterData: true }); function cleanup() { observer.disconnect(); clearTimeout(settleTimer); clearTimeout(forceTimer); clearTimeout(timeoutTimer); } // Hard Timeout timeoutTimer = setTimeout(() => { cleanup(); activeNode ? resolve(extractCleanData(activeNode)) : reject(new Error('90s timeout reached')); }, TIMEOUT_MS); }); })(); `;"
