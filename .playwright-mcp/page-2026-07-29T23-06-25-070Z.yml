              - generic: "Subject: 🚨 I need your expertise — my extension sends prompts but I can't read the AI's answers Hey team, I'm building a Chrome extension that automates conversations with AI chat sites. Here's where I'm at: Part 1 — Sending prompts ✅ WORKING The extension can open any AI chat site in a hidden tab, type a prompt, and hit send. It works across 6+ different sites. I'm using Chrome's debugger API to inject the text into the page. I have a stealth mode that avoids detection. Part 2 — Reading the answers ❌ I HAVE NO IDEA I need the extension to wait for the AI to finish typing its response, then grab the full answer text. But I don't want to write custom code for each website — I need one universal approach that works everywhere. What I'm giving you: Attached is my complete codebase (1397 lines). It's the full source — background.js, popup.js, popup.html, manifest.json. You can see exactly how Part 1 works. What I need from you: Read the codebase. Understand what this extension does. Then tell me: - How would YOU build Part 2? - What's the best strategy to detect when an AI finishes answering? - How do I extract the text reliably across different chat sites? - What pitfalls should I watch out for? Don't hold back. Give me your honest architectural recommendation. I want the best idea, not the easiest one. === MY FULL CODEBASE === # File Tree ``` ├── .gitignore ├── background.js ├── manifest.json ├── popup.html └── popup.js ``` # Source Files ## `.gitignore` ``` .env .env.* *.key *.pem *token* *secret* node_modules/ .DS_Store *.log ``` ## `background.js` ```js // ============================================================================ // AI Chat Auto-Prompt — background service worker // // THE CORE PROBLEM THIS FILE SOLVES: // Chrome only routes real, trusted input (including debugger-injected // keystrokes via chrome.debugger's Input.dispatchKeyEvent) to the ACTIVE // tab of a window. A background/inactive tab simply never receives it — // this isn't a bug, it's how Chrome's input pipeline works, confirmed both // by Chromium's own issue tracker and by real testing. So there is no way // to deliver a genuinely trusted Ctrl+V/Enter to a tab that isn't the // frontmost tab at that exact moment. // // THE FIX (default behavior): open every URL in parallel first — this part // really is simultaneous, since loading a background tab is NOT blocked, // only INPUT delivery is. Then, once every tab has had its chance to load, // the extension itself rapidly cycles which tab is \"active\" — the exact // same thing you were doing by hand with Ctrl+1/2/3 — briefly bringing each // tab to the front just long enough to paste and send, then moving to the // next one. No manual navigation needed; it's automated and near-instant // per tab (a few hundred ms). // // INPUT DETECTION (auto-cycle): Primary method polls document.activeElement // for up to 8s. If the site doesn't auto-focus its input, a fallback kicks // in: the extension simulates Tab keypresses (via debugger, trusted events, // page-only — the omnibox is never reached) to walk through all focusable // elements, collects text-input candidates, scores them (textarea > // contenteditable > input, large > small, bottom-of-page > top-of-page), // and focuses the best match. If both methods fail, the tab is aborted with // a clear error (no blind firing). // // TEXT INSERTION: The prompt is injected directly into each tab's focused // input via CDP's Input.insertText — no system clipboard is involved. // This means the user can freely copy/paste on their PC while the // extension runs without corrupting the prompt being sent. // // VERIFICATION: Two-stage post-send check. Stage 1 polls the tab URL for // 1.5s — if it changes, the prompt was delivered. If Stage 1 fails, Stage 2 // polls the exact input element we wrote into (found via a temporary // data-autoprompt-input attribute) for 1.5s — if its content is cleared, // the site consumed the prompt. If both stages fail, the tab is flagged // as a definitive failure (not \"uncertain\"). // // TARGETED RE-CHECK: If initial verification fails on a tab that received // the prompt, the extension does not immediately give up. After all tabs // are processed, it re-activates only the failed tabs, waits for the page // to settle, and re-runs the same two-stage verification. This fixes false // failures caused by sites pausing or delaying DOM updates while backgrounded. // // RETRY ENTER: If the targeted re-check still fails and the marked input // box still contains the prompt text, the extension re-focuses that exact // input box, re-attaches the debugger, and sends one more trusted Enter // keystroke. This is the final rescue step. If it fails, the tab remains // flagged as failed. // // STEALTH MODE: The \"experimentalBackground\" toggle switches to a fully // background \"stealth\" mode. Each tab is opened as about:blank, visibility // and focus are spoofed at the protocol level BEFORE any page JS runs, then // the tab navigates to the real URL. The input is located with a direct DOM // search (no OS focus needed), focused via CDP DOM.focus, and the prompt is // injected via Input.insertText + Enter. All tabs run in parallel and the // whole flow works while Chrome is minimized, with no focus stealing. // ============================================================================ chrome.runtime.onMessage.addListener((msg, sender, sendResponse) => { if (msg.type === 'RUN_AUTOMATION') { runAutomation(msg.urls, msg.prompt, { skipWait: !!msg.skipWait, experimentalBackground: !!msg.experimentalBackground }).catch((err) => console.error('[AI Chat Auto-Prompt] automation failed:', err)); sendResponse({ ok: true }); return true; } return false; }); function delay(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); } // ---- Logger (console only) ------------------------------------------------- function makeLogger() { function log(scope, message, data) { console.log(`[AI Chat Auto-Prompt] [${scope}] ${message}`, data !== undefined ? data : ''); } return { log }; } // ---- Tab load / focus detection -------------------------------------------- function waitForTabComplete(tabId, timeoutMs = 30000) { return new Promise((resolve) => { let finished = false; const finish = () => { if (finished) return; finished = true; clearTimeout(timer); chrome.tabs.onUpdated.removeListener(listener); resolve(); }; const timer = setTimeout(finish, timeoutMs); function listener(updatedTabId, changeInfo) { if (updatedTabId === tabId && changeInfo.status === 'complete') finish(); } chrome.tabs.onUpdated.addListener(listener); chrome.tabs.get(tabId, (tab) => { if (tab && tab.status === 'complete') finish(); }); }); } async function isInputFocused(tabId) { try { const results = await chrome.scripting.executeScript({ target: { tabId }, func: () => { const el = document.activeElement; if (!el) return false; const tag = el.tagName ? el.tagName.toLowerCase() : ''; return tag === 'textarea' || tag === 'input' || !!el.isContentEditable; } }); return !!(results && results[0] && results[0].result); } catch (e) { return false; } } async function waitForFocusedInput(tabId, maxWaitMs = 15000, stepMs = 350) { const start = Date.now(); while (Date.now() - start < maxWaitMs) { if (await isInputFocused(tabId)) return true; await delay(stepMs); } return false; } // ---- Input element marking (for post-send verification) --------------------- async function markInputElement(tabId) { try { await chrome.scripting.executeScript({ target: { tabId }, func: () => { const el = document.activeElement; if (el) el.setAttribute('data-autoprompt-input', 'true'); } }); } catch (e) {} } async function getMarkedInputContent(tabId) { try { const results = await chrome.scripting.executeScript({ target: { tabId }, func: () => { const el = document.querySelector('[data-autoprompt-input=\"true\"]'); if (!el) return null; if (el.value !== undefined) return el.value; return el.innerText || el.textContent || ''; } }); return results && results[0] ? results[0].result : null; } catch (e) { return null; } } async function cleanupInputElementMark(tabId) { try { await chrome.scripting.executeScript({ target: { tabId }, func: () => { const el = document.querySelector('[data-autoprompt-input=\"true\"]'); if (el) el.removeAttribute('data-autoprompt-input'); } }); } catch (e) {} } async function focusMarkedInput(tabId) { try { const results = await chrome.scripting.executeScript({ target: { tabId }, func: () => { const el = document.querySelector('[data-autoprompt-input=\"true\"]'); if (!el) return false; el.focus(); return true; } }); return !!(results && results[0] && results[0].result); } catch (e) { return false; } } // ---- Tab-navigation fallback helpers ---------------------------------------- function fingerprintsMatch(a, b) { return ( a.tag === b.tag && a.id === b.id && a.x === b.x && a.y === b.y && a.w === b.w && a.h === b.h ); } function scoreCandidate(data) { let score = 0; if (data.tag === 'textarea') score += 100; if (data.editable) score += 80; if (data.tag === 'input') score += 40; if (data.w > 400) score += 30; if (data.h > 60) score += 20; if (data.h > 200) score += 10; const ph = (data.placeholder || '').toLowerCase(); if (/message|prompt|ask|chat|type/.test(ph)) score += 15; if (data.y > data.viewportH * 0.5) score += 10; if (/search/.test(ph) && data.tag === 'input') score -= 20; return score; } async function findInputViaTabNavigation(tabId, logger) { const MAX_TABS = 50; let firstFingerprint = null; const candidates = []; for (let i = 0; i < MAX_TABS; i++) { await dispatchKey(tabId, { type: 'rawKeyDown', windowsVirtualKeyCode: 9, nativeVirtualKeyCode: 9, code: 'Tab', key: 'Tab' }); await dispatchKey(tabId, { type: 'keyUp', windowsVirtualKeyCode: 9, nativeVirtualKeyCode: 9, code: 'Tab', key: 'Tab' }); await delay(100); let info; try { const results = await chrome.scripting.executeScript({ target: { tabId }, func: () => { const el = document.activeElement; if (!el || el === document.body || el === document.documentElement) { return { type: 'none' }; } const tag = el.tagName ? el.tagName.toLowerCase() : ''; const editable = !!el.isContentEditable; const inputType = (el.type || '').toLowerCase(); const rect = el.getBoundingClientRect(); const fingerprint = { tag, id: el.id || '', x: Math.round(rect.x), y: Math.round(rect.y), w: Math.round(rect.width), h: Math.round(rect.height) }; const isCandidate = tag === 'textarea' || editable || (tag === 'input' && ['text', 'search', ''].includes(inputType)); if (!isCandidate) { return { type: 'not-candidate', fingerprint }; } const placeholder = el.placeholder || el.getAttribute('data-placeholder') || el.getAttribute('aria-label') || ''; const scoreData = { tag, editable, inputType, placeholder, w: Math.round(rect.width), h: Math.round(rect.height), y: Math.round(rect.y), viewportH: window.innerHeight }; const candidateIndex = document.querySelectorAll('[data-autoprompt-candidate]').length; el.setAttribute('data-autoprompt-candidate', String(candidateIndex)); return { type: 'candidate', fingerprint, scoreData, candidateIndex }; } }); info = results && results[0] && results[0].result; } catch (e) { logger.log(tabId, `Tab fallback: executeScript error on Tab ${i + 1}: ${e.message}`); break; } if (!info || info.type === 'none') continue; if (firstFingerprint === null) { firstFingerprint = info.fingerprint; } else if (fingerprintsMatch(info.fingerprint, firstFingerprint)) { logger.log(tabId, `Tab fallback: full cycle complete after ${i + 1} Tab presses`); break; } if (info.type === 'candidate') { candidates.push(info); logger.log(tabId, `Tab fallback: found candidate #${info.candidateIndex} (<${info.scoreData.tag}>, ${info.scoreData.w}x${info.scoreData.h})`); } } if (candidates.length === 0) { logger.log(tabId, 'Tab fallback: no text-input candidates found after full cycle'); try { await chrome.scripting.executeScript({ target: { tabId }, func: () => { document.querySelectorAll('[data-autoprompt-candidate]').forEach((el) => el.removeAttribute('data-autoprompt-candidate') ); } }); } catch (_e) {} return false; } let chosen; if (candidates.length === 1) { chosen = candidates[0]; logger.log(tabId, 'Tab fallback: only 1 candidate — using it directly (no scoring needed)'); } else { chosen = candidates.reduce((best, c) => scoreCandidate(c.scoreData) > scoreCandidate(best.scoreData) ? c : best ); logger.log(tabId, `Tab fallback: ${candidates.length} candidates — picked #${chosen.candidateIndex} (score ${scoreCandidate(chosen.scoreData)})`); } try { await chrome.scripting.executeScript({ target: { tabId }, func: (idx) => { const el = document.querySelector(`[data-autoprompt-candidate=\"${idx}\"]`); if (el) el.focus(); document.querySelectorAll('[data-autoprompt-candidate]').forEach((e) => e.removeAttribute('data-autoprompt-candidate') ); return !!el; }, args: [chosen.candidateIndex] }); } catch (e) { logger.log(tabId, `Tab fallback: failed to focus chosen element: ${e.message}`); return false; } await delay(150); const confirmed = await isInputFocused(tabId); logger.log(tabId, confirmed ? 'Tab fallback: chosen element is now focused — ready to send' : 'Tab fallback: focus confirmation failed'); return confirmed; } // ---- Trusted keystroke simulation via the debugger ------------------------- async function dispatchKey(tabId, params) { await chrome.debugger.sendCommand({ tabId }, 'Input.dispatchKeyEvent', params); } async function sendTextThenEnter(tabId, prompt) { await chrome.debugger.sendCommand({ tabId }, 'Input.insertText', { text: prompt }); await delay(600); await dispatchKey(tabId, { type: 'rawKeyDown', windowsVirtualKeyCode: 13, nativeVirtualKeyCode: 13, macCharCode: 13, code: 'Enter', key: 'Enter', text: '\\r', unmodifiedText: '\\r' }); await dispatchKey(tabId, { type: 'char', text: '\\r' }); await delay(30); await dispatchKey(tabId, { type: 'keyUp', windowsVirtualKeyCode: 13, nativeVirtualKeyCode: 13, code: 'Enter', key: 'Enter' }); } async function sendEnterOnly(tabId) { await dispatchKey(tabId, { type: 'rawKeyDown', windowsVirtualKeyCode: 13, nativeVirtualKeyCode: 13, macCharCode: 13, code: 'Enter', key: 'Enter', text: '\\r', unmodifiedText: '\\r' }); await dispatchKey(tabId, { type: 'char', text: '\\r' }); await delay(30); await dispatchKey(tabId, { type: 'keyUp', windowsVirtualKeyCode: 13, nativeVirtualKeyCode: 13, code: 'Enter', key: 'Enter' }); } // ---- Post-send verification (two-stage: URL change + input clearing) -------- async function verifySend(tabId, originalUrl, logger) { const urlDeadline = Date.now() + 1500; while (Date.now() < urlDeadline) { try { const { url: newUrl } = await chrome.tabs.get(tabId); if (newUrl !== originalUrl) { logger.log(tabId, 'Verification Stage 1: URL changed — Success'); return { verified: true, reason: 'URL changed — prompt was sent' }; } } catch (e) { logger.log(tabId, `Verification Stage 1 error: ${e.message}`); } await delay(500); } logger.log(tabId, 'Verification Stage 1 failed — starting Stage 2 (input clearing check)'); const inputDeadline = Date.now() + 1500; while (Date.now() < inputDeadline) { const content = await getMarkedInputContent(tabId); if (content === null) { logger.log(tabId, 'Stage 2: marked input element no longer exists — cannot verify'); break; } if (content.trim() === '') { logger.log(tabId, 'Verification Stage 2: input box cleared — Success'); return { verified: true, reason: 'Input box cleared — prompt was sent' }; } await delay(500); } logger.log(tabId, 'Verification failed: URL unchanged and input still contains text'); return { verified: false, reason: 'URL unchanged and input still contains text — send failed' }; } // ---- Targeted re-check + Stage 3 retry Enter ------------------------------- async function recheckFailedTab(result, logger) { try { const tab = await chrome.tabs.get(result.tabId); // Re-activate the tab so the site's JavaScript wakes up and updates the DOM/URL await chrome.tabs.update(result.tabId, { active: true }); if (tab && tab.windowId !== undefined) { await chrome.windows.update(tab.windowId, { focused: true }); } logger.log(result.tabId, `Re-check: activated tab (${result.url})`); // Give the site time to settle after being brought back to the front await delay(1500); // ---- Stage 2: targeted re-check (unchanged) ---- const verification = await verifySend(result.tabId, result.url, logger); if (verification.verified) { result.status = 'success'; result.reason = `Re-check success: ${verification.reason}`; logger.log(result.tabId, 'Re-check passed — status updated to success'); return; } logger.log(result.tabId, 'Re-check failed — evaluating Stage 3 (Retry Enter)'); // ---- Stage 3: Retry Enter only if the input box still contains text ---- const remainingText = await getMarkedInputContent(result.tabId); if (remainingText === null || remainingText.trim() === '') { result.status = 'error'; result.reason = `Re-check failed: ${verification.reason}`; logger.log(result.tabId, 'Stage 3 skipped — input box is empty or no longer exists'); return; } logger.log(result.tabId, 'Stage 3: input box still contains text — focusing input and retrying Enter'); const focused = await focusMarkedInput(result.tabId); if (!focused) { result.status = 'error'; result.reason = `Re-check failed: ${verification.reason}; Retry Enter skipped (could not focus marked input)`; logger.log(result.tabId, 'Stage 3 failed — could not focus marked input'); return; } await delay(200); // Re-attach the debugger because trusted Enter key events require it let debuggerAttached = false; try { await chrome.debugger.attach({ tabId: result.tabId }, '1.3'); debuggerAttached = true; logger.log(result.tabId, 'Stage 3: debugger re-attached for Enter retry'); } catch (e) { logger.log(result.tabId, `Stage 3: debugger attach failed: ${e.message}`); } if (!debuggerAttached) { result.status = 'error'; result.reason = `Re-check failed: ${verification.reason}; Retry Enter skipped (debugger attach failed)`; return; }