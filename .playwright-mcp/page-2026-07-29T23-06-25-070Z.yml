n complete. Results stored: ${results.length} tab(s)`); return results; } // ---- Main entry point -------------------------------------------------------- async function runAutomation(urls, prompt, opts) { const logger = makeLogger(); try { if (!Array.isArray(urls) || urls.length === 0) { logger.log('main', 'No URLs provided, aborting.'); await chrome.storage.local.set({ lastRunResults: [], lastRunFinishedAt: Date.now() }); return; } let results; if (opts.experimentalBackground) { results = await runAutomationStealth(urls, prompt, opts.skipWait, logger); } else { results = await runAutomationAutoCycle(urls, prompt, opts.skipWait, logger); } return results; } catch (err) { logger.log('main', `Unhandled error: ${err && err.message}`); await chrome.storage.local.set({ lastRunResults: [], lastRunFinishedAt: Date.now() }); throw err; } } ``` ## `manifest.json` ```json { \"manifest_version\": 3, \"name\": \"BYPASS API_CLAUDE_BUREAU\", \"version\": \"1.0.0\", \"description\": \"Opens an AI chat URL and auto-sends your prompt by simulating a real Ctrl+V paste and Enter keystroke.\", \"permissions\": [\"tabs\", \"scripting\", \"debugger\", \"storage\"], \"host_permissions\": [\"<all_urls>\"], \"action\": { \"default_popup\": \"popup.html\" }, \"background\": { \"service_worker\": \"background.js\" } } ``` ## `popup.html` ```html <!DOCTYPE html> <html> <head> <meta charset=\"UTF-8\"> <style> body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Arial, sans-serif; width: 320px; padding: 14px; background: #1e1e1e; color: #eee; } h3 { margin: 0 0 4px 0; font-size: 15px; font-weight: 600; } .sub { font-size: 11px; color: #888; margin-bottom: 10px; } label { font-size: 12px; color: #aaa; display: block; margin-top: 10px; margin-bottom: 4px; } input[type=\"text\"], textarea { width: 100%; box-sizing: border-box; background: #2b2b2b; border: 1px solid #444; color: #eee; border-radius: 6px; padding: 8px; font-size: 13px; font-family: inherit; } textarea { resize: vertical; min-height: 90px; } input:focus, textarea:focus { outline: none; border-color: #4f7cff; } button { width: 100%; margin-top: 14px; padding: 10px; border: none; border-radius: 6px; background: #4f7cff; color: white; font-size: 14px; font-weight: 600; cursor: pointer; } button:disabled { background: #555; cursor: default; } #status { margin-top: 8px; font-size: 12px; color: #9ad; min-height: 14px; white-space: pre-line; } #results-section { margin-top: 14px; border-top: 1px solid #333; padding-top: 10px; display: none; } #results-section h4 { margin: 0 0 6px 0; font-size: 12px; color: #aaa; font-weight: 600; } .result-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; font-size: 11px; line-height: 1.4; } .result-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; } .result-dot.success { background: #4caf50; } .result-dot.uncertain { background: #ff9800; } .result-dot.error { background: #f44336; } .result-url { color: #ccc; word-break: break-all; } .result-reason { color: #777; font-size: 10px; margin-top: 1px; } .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 8px; } .toggle-row .toggle-label { font-size: 12px; color: #ccc; line-height: 1.3; } .toggle-row .toggle-hint { font-size: 10px; color: #777; } .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; } .switch input { opacity: 0; width: 0; height: 0; } .slider { position: absolute; cursor: pointer; inset: 0; background-color: #444; transition: .15s; border-radius: 20px; } .slider:before { position: absolute; content: \"\"; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .15s; border-radius: 50%; } input:checked + .slider { background-color: #4f7cff; } input:checked + .slider:before { transform: translateX(16px); } </style> </head> <body> <h3>AI Chat Auto-Prompt</h3> <div class=\"sub\">Opens tabs in parallel, pastes,