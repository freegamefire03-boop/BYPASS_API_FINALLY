              - paragraph [ref=e2609]: "ROUND 3: FINAL SYNTHESIS — The \"Signal-Driven Answer Reader\" Plan I received 5 architectural proposals (Qwen, Z.ai/GLM-5.2, Gemini, Kimi, DeepSeek). Perplexity refused. Now I have synthesized the strongest ideas into one unified plan. I need you to CRITIQUE this plan mercilessly, then propose your final refinements. == THE SYNTHESIZED PLAN == ### Execution Model - Mechanism: CDP Runtime.evaluate with awaitPromise:true, returning by value. Consensus: DeepSeek's pattern was adopted by everyone. No chrome.scripting dependency. - Lifecycle: Attach debugger → inject observer → send prompt → await promise → extract → detach. ### Observer Injection (Pre-Send) - When: Injected via CDP Runtime.evaluate BEFORE Input.insertText, while debugger is already attached. - What: A MutationObserver on document.body (childList + subtree + characterData) that builds a candidate map. - Why: Kimi correctly identified that pre-injection captures the very first mutations of the response, avoiding race conditions. ### Candidate Scoring (Element Identification) - Scoring factors (normalized, best candidate wins): - Text length (log-scaled, cap at 3000) - Growth rate (chars/sec over last 2s window, ×40 weight) - Vertical position (bottom 25-75% of viewport = +600, penalize top 100px) - Width > 300px and height > 50px bonuses - Recency penalty (−0.5 per ms since last mutation) - Mutation count penalty (−2 per mutation, to penalize spinners/loading indicators) - Fingerprint: TagName + rounded (x,y) position. Candidate Map keyed by fingerprint. - Output: Each poll returns the highest-scored candidate's text and metadata. ### Completion Detection (Multi-Signal Circuit) - Signal 1 — Text Stability (PRIMARY): Best candidate textLength unchanged for 3 seconds. Adaptive: if candidate text contains \"thinking\" or \"reasoning\", extend to 6s. - Signal 2 — Input Re-enabled (HIGH): The data-autoprompt-input element is no longer disabled/readonly. Gemini identified this as the most universal binary signal. - Signal 3 — Stop Button Gone (MEDIUM): No visible button matching /stop|halt|generate/i. Z.ai contribution. - Signal 4 — Hard Timeout (LOW): 90s absolute max. Return whatever we have. - Circuit logic: Signal 1 AND (Signal 2 OR Signal 3) = COMPLETE. If Signal 1 alone for 8s, also COMPLETE with partial warning. ### Extraction Strategy - Primary: Best candidate innerText with cleanup (strip buttons, SVGs, nav elements via cloneNode). - Fallback 1 (low candidate score): Delta diff — body.innerText before/after, lastIndexOf(prompt) as anchor. - Fallback 2 (prompt found in DOM): TreeWalker to prompt text node → parent container → subsequent sibling (DeepSeek approach). - Output: { text, html, wordCount, confidence: high|medium|low } ### MV3 Considerations - Debugger attachment keeps worker alive. - onDetach listener to abort watcher gracefully. - observer.disconnect() and cleanup on resolve. - Tab crash → promise rejects → caught → cleanup → status = error. ### Shadow DOM - Initial: IGNORE shadow roots (95% coverage). - Future: Recursive shadowRoot walker. - Targeting light DOM only. ### CDP Network Layer - EXCLUDED from base plan. Too fragile per-site SSE/WebSocket schema knowledge required. - Reserved as optional accelerator for known domains. == YOUR TASK == 1. CRITIQUE: What is STILL wrong or missing? Identify contradictions, race conditions, blind spots. 2. REFINE: For EACH section above, tell me exactly what to change and why. 3. FINAL CODE: Write complete injectResponseWatcher.js — the string for Runtime.evaluate. Include: MutationObserver, scoring, completion detection with all signals, extraction with fallbacks, cleanup. 4. TRADE-OFF ACKNOWLEDGMENT: For every compromise, state what edge case it misses. Be blunt. Tear the plan apart."
