              - heading "Summary" [level=3] [ref=e345]
              - paragraph [ref=e346]: You don't need a massive adapter pattern with CSS selectors for every site. By leveraging the "Stop button" heuristic, confirming via "Text Stability", and extracting via "Text Diffing", you achieve a 95% universal solution in about 50 lines of code. It's clean, maintainable, and perfectly complements your CDP injection architecture.
