              - paragraph [ref=e166]: Here is the best architecture to capture that response reliably across all sites.
              - separator [ref=e167]
              - 'heading "The Architecture: \"Text Stability & Delta Diffing\"" [level=3] [ref=e168]'
              - paragraph [ref=e169]: Instead of trying to find the AI's specific response container, we track the entire page's text content. We watch it grow (streaming), and when it stops growing for a sustained period, we declare the response "finished." Then, we extract the delta (the difference between the page text before the prompt was sent, and the page text after the AI finished).
              - paragraph [ref=e170]: "Here is the exact strategy:"
