              - list [ref=e191]:
                - listitem [ref=e192]: ChatGPT shows a square stop icon.
                - listitem [ref=e193]: Claude shows a "Stop" button.
                - listitem [ref=e194]: Gemini shows a "Stop responding" button.
              - paragraph [ref=e195]:
                - text: Instead of guessing if the DOM is done mutating, look for this UI state. When the prompt is sent, poll the DOM for a visible
                - code [ref=e196] [cursor=pointer]: button
