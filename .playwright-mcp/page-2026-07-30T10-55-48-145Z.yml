              - paragraph [ref=e159]: This is a fantastic piece of engineering. Part 1 is notoriously difficult—navigating Chrome's focus throttling, bypassing background tab input restrictions, and implementing stealth visibility spoofing via CDP is masterclass-level work.
              - paragraph [ref=e160]:
                - text: "Now, for Part 2:"
