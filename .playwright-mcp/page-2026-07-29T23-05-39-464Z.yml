              - paragraph [ref=f1e160]: "Subject: 🚨 I need your expertise — my extension sends prompts but I can't read the AI's answers Hey team, I'm building a Chrome extension that automates conversations with AI chat sites. Here's where I'm at: Part 1 — Sending prompts ✅ WORKING The extension can open any AI chat site in a hidden tab, type a prompt, and hit send. It works across 6+ different sites. I'm using Chrome's debugger API to inject the text into the page. I have a stealth mode that avoids detection. Part 2 — Reading the answers ❌ I HAVE NO IDEA I need the extension to wait for the AI to finish typing its response, then grab the full answer text. But I don't want to write custom code for each website — I need one universal approach that works everywhere. What I'm giving you: Attached is my complete codebase (1397 lines). It's the full source — background.js, popup.js, popup.html, manifest.json. You can see exactly how Part 1 works. What I need from you: Read the codebase. Understand what this extension does. Then tell me: - How would YOU build Part 2? - What's the best strategy to detect when an AI finishes answering? - How do I extract the text reliably across different chat sites? - What pitfalls should I watch out for? Don't hold back. Give me your honest architectural recommendation. I want the best idea, not the easiest one. === MY FULL CODEBASE === # File Tree ``` ├── .gitignore ├── background.js ├── manifest.json ├── popup.html └── popup.js ``` # Source Files ## `.gitignore` ``` .env .env.* *.key *.pem *token* *secret* node_modules/ .DS_Store *.log ``` ## `background.js` ```js // ============================================================================ // AI Chat Auto-Prompt — background service worker // // THE CORE PROBLEM THIS FILE SOLVES: // Chrome only routes real, trusted input (including debugger-injected // keystrokes via chrome.debugger's Input.dispatchKeyEvent) to the ACTIVE // tab of a window. A background/inactive tab simply never receives it — // this isn't a bug, it's how Chrome's input pipeline works, confirmed both // by Chromium's own issue tracker and by real testing. So there is no way // to deliver a genuinely trusted Ctrl+V/Enter to a tab that isn't the // frontmost tab at that exact moment. // // THE FIX (default behavior): open every URL in parallel first — this part // really is simultaneous, since loading a background tab is NOT blocked, // only INPUT delivery is. Then, once every tab has had its chance to load, // the extension itself rapidly cycles which tab is \"active\" — the exact // same thing you were doing by hand with Ctrl+1/2/3 — briefly bringing each // tab to the front just long enough to paste and send, then moving to the // next one. No manual navigation needed; it's automated and near-instant // per tab (a few hundred ms). // // INPUT DETECTION (auto-cycle): Primary method polls document.activeElement // for up to 8s. If the site doesn't auto-focus its input, a fallback kicks // in: the extension simulates Tab keypresses (via debugger, trusted events, // page-only — the omnibox is never reached) to walk through all focusable // elements, collects text-input candidates, scores them (textarea > // contenteditable > input, large > small, bottom-of-page > top-of-page), // and focuses the best match. If both methods fail, the tab is aborted with // a clear error (no blind firing). // // TEXT INSERTION: The prompt is injected directly into each tab's focused // input via CDP's Input.insertText — no system clipboard is involved. // This means the user can freely copy/paste on their PC while the // extension runs without corrupting the prompt being sent. // // VERIFICATION: Two-stage post-send check. Stage 1 polls the tab URL for // 1.5s — if it changes, the prompt was delivered. If Stage 1 fails, Stage 2 // polls the exact input element we wrote into (found via a temporary // data-autoprompt-input attribute) for 1.5s — if its content is cleared, // the site consumed the prompt. If both stages fail, the tab is flagged // as a definitive failure (not \"uncertain\"). // // TARGETED RE-CHECK: If initial verification fails on a tab that received // the prompt, the extension does not immediately give up. After all tabs // are processed, it re-activates only the failed tabs, waits for the page // to settle, and re-runs the same two-stage verification. This fixes false // failures caused by sites pausing or delaying DOM updates while backgrounded. // // RETRY ENTER: If the targeted re-check still fails and the marked input // box still contains the prompt text, the extension re-focuses that exact // input box, re-attaches the debugger, and sends one more trusted Enter // keystroke. This is the final rescue step. If it fails, the tab remains // flagged as failed. // // STEALTH MODE: The \"experimentalBackground\" toggle switches to a fully // background \"stealth\" mode. Each tab is opened as about:blank, visibility // and focus are spoofed at the protocol level BEFORE any page JS runs, then // the tab navigates to the real URL. The input is located with a direct DOM // search (no OS focus needed), focused via CDP DOM.focus, and the prompt is // injected via Input.insertText + Enter. All tabs run in parallel and the // whole flow works while Chrome is minimized, with no focus stealing. // ============================================================================ chrome.runtime.onMessage.addListener((msg, sender, sendResponse) => { if (msg.type === 'RUN_AUTOMATION') { runAutomation(msg.urls, msg.prompt, { skipWait: !!msg.skipWait, experimentalBackground: !!msg.experimentalBackground }).catch((err) => console.error('[AI Chat Auto-Prompt] automation failed:', err)); sendResponse({ ok: true }); return true; } return false; }); function delay(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); } // ---- Logger (console only) ------------------------------------------------- function makeLogger() { function log(scope, message, data) { console.log(`[AI Chat Auto-Prompt] [${scope}] ${message}`, data !== undefined ? data : ''); } return { log }; } // ---- Tab load / focus detection -------------------------------------------- function waitForTabComplete(tabId, timeoutMs = 30000) { return new Promise((resolve) => { let finished = false; const finish = () => { if (finished) return; finished = true; clearTimeout(timer); chrome.tabs.onUpdated.removeListener(listener); resolve(); }; const timer = setTimeout(finish, timeoutMs); function listener(updatedTabId, changeInfo) { if (updatedTabId === tabId && changeInfo.status === 'complete') finish(); } chrome.tabs.onUpdated.addListener(listener); chrome.tabs.get(tabId, (tab) => { if (tab && tab.status === 'complete') finish(); }); }); } async function isInputFocused(tabId) { try { const results = await chrome.scripting.executeScript({ target: { tabId }, func: () => { const el = document.activeElement; if (!el) return false; const tag = el.tagName ? el.tagName.toLowerCase() : ''; return tag === 'textarea' || tag === 'input' || !!el.isContentEditable; } }); return !!(results && results[0] && results[0].result); } catch (e) { return false; } } async function waitForFocusedInput(tabId, maxWaitMs = 15000, stepMs = 350) { const start = Date.now(); while (Date.now() - start < maxWaitMs) { if (await isInputFocused(tabId)) return true; await delay(stepMs); } return false; } // ---- Input element marking (for post-send verification) --------------------- async function markInputElement(tabId) { try { await chrome.scripting.executeScript({ target: { tabId }, func: () => { const el = document.activeElement; if (el) el.setAttribute('data-autoprompt-input', 'true'); } }); } catch (e) {} } async function getMarkedInputContent(tabId) { try { const results = await chrome.scripting.executeScript({ target: { tabId }, func: () => { const el = document.querySelector('[data-autoprompt-input=\"true\"]'); if (!el) return null; if (el.value !== undefined) return el.value; return el.in