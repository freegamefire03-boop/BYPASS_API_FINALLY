                - paragraph [ref=e159]: This is a fantastic piece of engineering. Part 1 is notoriously difficult—navigating Chrome's focus throttling, bypassing background tab input restrictions, and implementing stealth visibility spoofing via CDP is masterclass-level work.
                - paragraph [ref=e160]:
                  - text: "Now, for Part 2:"
                  - strong [ref=e161]: Reading the AI's response universally.
                - paragraph [ref=e162]:
                  - text: "You asked for the best architectural recommendation, not the easiest. Here is the honest truth:"
                  - strong [ref=e163]: there is no such thing as a 100% "universal" CSS selector
                  - text: because every AI site structures its DOM differently (React vs. Vue, shadow DOMs, varying class names).
                - paragraph [ref=e164]:
                  - text: However, there
                  - strong [ref=e165]: is a universal behavioral pattern
                  - text: ". All AI chat sites do the exact same thing: they receive the prompt, clear the input box, stream text into the DOM, and then stop."
                - paragraph [ref=e166]: Here is the best architecture to capture that response reliably across all sites.
                - separator [ref=e167]
                - 'heading "The Architecture: \"Text Stability & Delta Diffing\"" [level=3] [ref=e168]'
                - paragraph [ref=e169]: Instead of trying to find the AI's specific response container, we track the entire page's text content. We watch it grow (streaming), and when it stops growing for a sustained period, we declare the response "finished." Then, we extract the delta (the difference between the page text before the prompt was sent, and the page text after the AI finished).
                - paragraph [ref=e170]: "Here is the exact strategy:"
                - heading "1. The Pre-Send Snapshot" [level=4] [ref=e171]
                - paragraph [ref=e172]:
                  - text: Right before you call
                  - code [ref=e173] [cursor=pointer]: sendTextThenEnter
                  - text: ", grab a snapshot of the page's text content. Because you are sending the prompt, you know exactly what text is about to be submitted."
