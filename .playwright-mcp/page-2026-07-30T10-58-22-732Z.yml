                - paragraph [ref=e385]: "This is an excellent synthesis challenge. The four proposals represent fundamentally different philosophies of browser automation: Network interception (Qwen), State/Signal tracking (Gemini), Pre-emptive DOM mapping (Kimi), and Contextual Traversal (DeepSeek)."
                - paragraph [ref=e386]: Here is the ultimate breakdown, the final architectural decision, and the production-ready code.
                - separator [ref=e387]
                - 'heading "1. CRITIQUE: What each gets right and wrong" [level=3] [ref=e388]'
                - paragraph [ref=e389]:
                  - strong [ref=e390]: Qwen — "Two-Layer System" (Network + DOM)
                - list [ref=e391]:
                  - listitem [ref=e392]:
                    - strong [ref=e393]: "Right:"
                    - text: Network events (SSE/WebSocket closing) are the
                    - emphasis [ref=e394]: most mathematically accurate
                    - text: signal that the server has finished transmitting data.
                  - listitem [ref=e395]:
                    - strong [ref=e396]: "Wrong:"
                    - text: It violates the "universal" constraint. Parsing SSE streams requires knowing the site's specific JSON schema (e.g., OpenAI uses
                    - code [ref=e397] [cursor=pointer]: "data: {\"choices\":[{\"delta\":...}]}"
                    - text: ", Claude uses different shapes). Furthermore, the network stream often closes"
                    - emphasis [ref=e398]: before
                    - text: the frontend JS finishes rendering the final markdown, leading to truncated text. MV3 service workers also struggle to hold complex CDP network subscriptions alive for long durations without timing out.
                - paragraph [ref=e399]:
                  - strong [ref=e400]: Gemini — "Heuristic DOM Settling + Input Lock"
                - list [ref=e401]:
                  - listitem [ref=e402]:
                    - strong [ref=e403]: "Right:"
                    - text: The "Input Lock" observation is genius. 99% of AI sites disable their textarea (
                    - code [ref=e404] [cursor=pointer]: disabled=true
                    - text: or
                    - code [ref=e405] [cursor=pointer]: aria-disabled="true"
                    - text: ) while generating, and re-enable it when done. This is a brilliant, universal state signal. MutationObserver is also the most performant way to track DOM changes.
                  - listitem [ref=e406]:
                    - strong [ref=e407]: "Wrong:"
                    - text: Finding the "fastest-growth node" requires heavy computation on every mutation, which can cause jank on long responses.
                - paragraph [ref=e408]:
                  - strong [ref=e409]: Kimi — "Conversation Archaeology Engine"
                - list [ref=e410]:
                  - listitem [ref=e411]:
                    - strong [ref=e412]: "Right:"
                    - text: Pre-injecting the MutationObserver
                    - emphasis [ref=e413]: before
                    - text: sending the prompt ensures you catch the very first token, preventing race conditions. The scoring system is a robust way to identify the response container amidst noisy DOM updates.
