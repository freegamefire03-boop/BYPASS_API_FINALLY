                  - text: The single most reliable universal indicator that an AI is
                  - emphasis [ref=e190]: actively
                  - text: generating is the presence of a "Stop Generating" button.
                - list [ref=e191]:
                  - listitem [ref=e192]: ChatGPT shows a square stop icon.
                  - listitem [ref=e193]: Claude shows a "Stop" button.
                  - listitem [ref=e194]: Gemini shows a "Stop responding" button.
                - paragraph [ref=e195]:
                  - text: Instead of guessing if the DOM is done mutating, look for this UI state. When the prompt is sent, poll the DOM for a visible
                  - code [ref=e196] [cursor=pointer]: button
                  - text: or
                  - code [ref=e197] [cursor=pointer]: "[role=\"button\"]"
                  - text: containing an SVG, or text/aria-labels matching
                  - code [ref=e198] [cursor=pointer]: /stop|halt|interrupt/i
                  - text: .
                - list [ref=e199]:
                  - listitem [ref=e200]: "When it appears: The AI is typing."
                  - listitem [ref=e201]: "When it disappears: The AI is definitively finished."
                - heading "3. The Text Stability Fallback" [level=4] [ref=e202]
                - paragraph [ref=e203]:
                  - text: If you can't find the Stop button (some sites might just toggle a class), use
                  - strong [ref=e204]: Text Stability
                  - text: . Poll
                  - code [ref=e205] [cursor=pointer]: document.body.innerText
                  - text: every 500ms. If the text length hasn't changed for 3 consecutive checks (1.5 seconds), assume the stream has finished.
